name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: CLI test suite
        # SAFE_DELETE_ENABLED=0: the dev safety shim blocks bulk deletes with a
        # confirmation prompt that has no stdin in CI.
        run: node tests/test-cli.mjs
        env:
          SAFE_DELETE_ENABLED: "0"
          CI: "true"

      - name: Example build + client pipeline tests
        run: npm test
        env:
          SAFE_DELETE_ENABLED: "0"
