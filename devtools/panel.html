<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rosefn</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; margin: 0; padding: 10px; }
  h2 { font: 600 11px/1 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em;
       opacity: .6; margin: 14px 0 6px; }
  h2:first-child { margin-top: 0; }
  #url { font-weight: 600; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .dim { opacity: .55; }
  .bar { display: flex; gap: 14px; flex-wrap: wrap; }
  .bar b { font-weight: 600; }
</style>
</head>
<body>
<h2>Page</h2>
<div id="url" class="dim">reading&hellip;</div>
<h2>Signal graph <span class="dim">(window.__rosefn.state())</span></h2>
<pre id="state" class="dim">&hellip;</pre>
<h2>Prefetch <span class="dim">(window.__rosefn.prefetch())</span></h2>
<pre id="prefetch" class="dim">&hellip;</pre>
<script src="panel.js"></script>
</body>
</html>
